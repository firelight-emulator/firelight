[General]
IndentWidth=4
NewlineType=unix

; Line wrapping stays off. qmlformat wraps long expressions by indenting the
; continuation under the operator, which cascades into unreadable staircases on
; nested ternaries. 120 columns remains the rule for QML, met by restructuring
; the expression rather than by auto-wrapping.
MaxColumnWidth=-1
UseTabs=false
SemicolonRule=always
SingleLineEmptyObjects=false

; Blank line between objects and between functions
ObjectsSpacing=true
FunctionsSpacing=true

; NormalizeOrder and GroupAttributesTogether reorder object attributes, which
; is what drops explicitly-written property names. Both stay off.
NormalizeOrder=false
GroupAttributesTogether=false
SortImports=false
