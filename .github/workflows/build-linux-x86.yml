name: Build linux_x86

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CMAKE_GENERATOR: Ninja

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang \
            clang-tools \
            cmake \
            ffmpeg \
            gettext \
            libgtest-dev \
            libarchive-dev \
            ninja-build \
            nlohmann-json3-dev \
            nsis \
            libsdl2-dev \
            libspdlog-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libxkbcommon-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \ 
            libswscale-dev \ 
            libswresample-dev \
            libsqlite3-dev

      - name: Install CPR
        run: |
          git clone https://github.com/libcpr/cpr.git
          cd cpr
          cmake -B build -DCPR_USE_SYSTEM_CURL=ON
          cmake --build build
          sudo cmake --install build

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtquick3d qtquicktimeline qtshadertools
          cache: true

      - name: Configure CMake
        run: cmake -B build -G "${{env.CMAKE_GENERATOR}}" -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build build

      - name: Run unit tests
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

